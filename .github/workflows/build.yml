name: Build FakeMoney

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Find the project folder
        id: find
        run: |
          FILE=$(find . -name settings.gradle -not -path "./.git/*" | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No settings.gradle found in the repo. Upload the project files (build.gradle, settings.gradle, src/...) to GitHub."
            ls -R
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "Project folder: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build the mod
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build

      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: fakemoney-jar
          path: |
            ${{ steps.find.outputs.dir }}/build/libs/*.jar
            !${{ steps.find.outputs.dir }}/build/libs/*-sources.jar
